<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1340" width="900" height="1340" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
  <!-- Roteamento do token-router — 24/10/2026 (2.0): só Claude e modelos locais; contingência StopFailure → claude-local. Coordenadas fixas. -->
  <defs>
    <style>
      .h { font-size:14px; font-weight:600; fill:#1B2130; }
      .b { font-size:12.5px; font-weight:600; fill:#1B2130; }
      .s { font-size:11.5px; fill:#4B5563; }
      .t { font-size:11px; fill:#4B5563; }
      .sw { font-size:11.5px; fill:#FFFFFF; }
      .hw { font-size:14px; font-weight:600; fill:#FFFFFF; }
      .cont { fill:none; stroke:#9CA3AF; stroke-width:1; stroke-dasharray:5 4; }
      .arr { stroke:#6B7280; stroke-width:1.2; fill:none; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#6B7280" stroke-width="1.5"/></marker>
  </defs>
  <rect width="900" height="1340" fill="#FFFFFF"/>
  <rect x="320" y="16" width="260" height="56" rx="6" fill="#6D28D9"/>
  <text class="hw" x="450" y="40" text-anchor="middle">Opus 5.5 — cérebro</text>
  <text class="sw" x="450" y="58" text-anchor="middle">camada 1 · decide, arquiteta, redige peça</text>
  <rect x="215" y="94" width="470" height="62" rx="6" fill="#B91C1C"/>
  <text class="hw" x="450" y="114" text-anchor="middle">Só Claude e modelos locais — nenhuma nuvem de terceiros</text>
  <text class="sw" x="450" y="131" text-anchor="middle">Codex · AGY/Gemini · Copilot: independentes, nunca acionados por aqui</text>
  <text class="sw" x="450" y="147" text-anchor="middle">evidência original: nunca · só cópia de trabalho com proveniência</text>
  <line class="arr" x1="450" y1="72" x2="450" y2="94" marker-end="url(#a)"/>
  <rect x="20" y="184" width="425" height="306" rx="6" class="cont"/>
  <text class="h" x="30" y="204">Locais (Ollama) — nada sai da máquina</text>
  <text class="t" x="30" y="222">camada 2 · comanda e confere</text>
  <text class="t" x="230" y="222">camada 3 · trabalha</text>
  <line class="arr" x1="215" y1="125" x2="150" y2="184" marker-end="url(#a)"/>
  <rect x="30" y="232" width="170" height="56" rx="4" fill="#DBEAFE" stroke="#2563EB"/>
  <text class="b" x="40" y="254">dsh-local (sonnet)</text>
  <text class="t" x="40" y="272">1–4 arq. · revisor 2ª família</text>
  <line class="arr" x1="200" y1="260" x2="218" y2="260" marker-end="url(#a)"/>
  <rect x="220" y="232" width="215" height="56" rx="4" fill="#D1FAE5" stroke="#059669"/>
  <text class="b" x="230" y="254">DSH</text>
  <text class="t" x="230" y="272">gpt-oss:20b (8 GB: divide CPU/GPU)</text>
  <rect x="30" y="295" width="170" height="56" rx="4" fill="#DBEAFE" stroke="#2563EB"/>
  <text class="b" x="40" y="317">qwen-local (haiku)</text>
  <text class="t" x="40" y="335">lote: &gt;5 arquivos</text>
  <line class="arr" x1="200" y1="323" x2="218" y2="323" marker-end="url(#a)"/>
  <rect x="220" y="295" width="215" height="56" rx="4" fill="#D1FAE5" stroke="#059669"/>
  <text class="b" x="230" y="317">Qwen Code</text>
  <text class="t" x="230" y="335">Qwen3-Coder-Next 80B · minutos</text>
  <rect x="30" y="358" width="170" height="56" rx="4" fill="#DBEAFE" stroke="#2563EB"/>
  <text class="b" x="40" y="380">opencode (sonnet)</text>
  <text class="t" x="40" y="398">pergunta ao acervo do caso</text>
  <line class="arr" x1="200" y1="386" x2="218" y2="386" marker-end="url(#a)"/>
  <rect x="220" y="358" width="215" height="56" rx="4" fill="#D1FAE5" stroke="#059669"/>
  <text class="b" x="230" y="380">OpenCode · investigador</text>
  <text class="t" x="230" y="398">Nemotron 3.5 · MCPs rag+forense</text>
  <rect x="30" y="421" width="405" height="56" rx="4" fill="#F3F4F6" stroke="#9CA3AF"/>
  <text class="b" x="40" y="443">modelo local: sempre o mais completo</text>
  <text class="t" x="40" y="461">falta VRAM → descarrega residentes, nunca rebaixa</text>
  <rect x="455" y="184" width="425" height="306" rx="6" class="cont"/>
  <text class="h" x="465" y="204">Claude — camada 2 (Sonnet 5.5)</text>
  <text class="t" x="465" y="222">camada 2 · comanda e confere</text>
  <line class="arr" x1="685" y1="125" x2="750" y2="184" marker-end="url(#a)"/>
  <rect x="465" y="232" width="405" height="56" rx="4" fill="#F3F4F6" stroke="#9CA3AF"/>
  <text class="b" x="475" y="254">Explore · resumidor</text>
  <text class="t" x="475" y="272">fazem direto; grafo antes de ler arquivo</text>
  <rect x="465" y="295" width="405" height="56" rx="4" fill="#F3F4F6" stroke="#9CA3AF"/>
  <text class="b" x="475" y="317">executor</text>
  <text class="t" x="475" y="335">plano fechado · 1–2 arquivos direto</text>
  <rect x="465" y="358" width="405" height="56" rx="4" fill="#F3F4F6" stroke="#9CA3AF"/>
  <text class="b" x="475" y="380">revisor</text>
  <text class="t" x="475" y="398">confere todo trabalho local; adversarial</text>
  <rect x="465" y="421" width="405" height="56" rx="4" fill="#F3F4F6" stroke="#9CA3AF"/>
  <text class="b" x="475" y="443">limiar de despacho</text>
  <text class="t" x="475" y="461">só vai ao local quando o volume compensa</text>
  <rect x="20" y="504" width="860" height="78" rx="6" fill="#FEE2E2" stroke="#DC2626"/>
  <text class="h" x="450" y="524" text-anchor="middle">Trabalho da camada 3 é NÃO revisado — o comandante confere antes de devolver ao Opus</text>
  <text class="s" x="450" y="541" text-anchor="middle">saída crua nunca entra na janela do Opus · código → revisor (sonnet) e, em bloco grande, dsh-local revisor</text>
  <text class="s" x="450" y="557" text-anchor="middle">consulta ao acervo → conferir proveniência (forense_path/custodia) antes de citar</text>
  <text class="s" x="450" y="573" text-anchor="middle">negativo ("não encontrei") → confirmar por Grep literal antes de subir</text>
  <line class="arr" x1="232" y1="490" x2="232" y2="504" marker-end="url(#a)"/>
  <line class="arr" x1="667" y1="490" x2="667" y2="504" marker-end="url(#a)"/>
  <rect x="20" y="596" width="860" height="150" rx="6" class="cont"/>
  <text class="h" x="30" y="616">Contingência automática — hook StopFailure, só em fim de crédito (100%) · 1 vez por sessão</text>
  <text class="s" x="30" y="633">sem gatilho por porcentagem (descartado em 24/10/2026) · o Claude revisa o trabalho na volta</text>
  <rect x="30" y="648" width="136" height="50" rx="4" fill="#EDE9FE" stroke="#7C3AED"/>
  <text class="b" x="98" y="668" text-anchor="middle">fim de crédito</text>
  <text class="t" x="98" y="686" text-anchor="middle">billing_error · rate_limit</text>
  <rect x="171" y="648" width="136" height="50" rx="4" fill="#FEF3C7" stroke="#D97706"/>
  <text class="b" x="239" y="668" text-anchor="middle">hook StopFailure</text>
  <text class="t" x="239" y="686" text-anchor="middle">1 vez por sessão</text>
  <line class="arr" x1="166" y1="673" x2="170" y2="673" marker-end="url(#a)"/>
  <rect x="312" y="648" width="136" height="50" rx="4" fill="#D1FAE5" stroke="#059669"/>
  <text class="b" x="380" y="668" text-anchor="middle">claude-local</text>
  <text class="t" x="380" y="686" text-anchor="middle">mesma conversa</text>
  <line class="arr" x1="307" y1="673" x2="311" y2="673" marker-end="url(#a)"/>
  <rect x="453" y="648" width="136" height="50" rx="4" fill="#D1FAE5" stroke="#059669"/>
  <text class="b" x="521" y="668" text-anchor="middle">Ollama local</text>
  <text class="t" x="521" y="686" text-anchor="middle">qwen3-coder:30b</text>
  <line class="arr" x1="448" y1="673" x2="452" y2="673" marker-end="url(#a)"/>
  <rect x="594" y="648" width="136" height="50" rx="4" fill="#EDE9FE" stroke="#7C3AED"/>
  <text class="b" x="662" y="668" text-anchor="middle">volta o crédito</text>
  <text class="t" x="662" y="686" text-anchor="middle">SessionStart avisa</text>
  <line class="arr" x1="589" y1="673" x2="593" y2="673" marker-end="url(#a)"/>
  <rect x="735" y="648" width="136" height="50" rx="4" fill="#DBEAFE" stroke="#2563EB"/>
  <text class="b" x="803" y="668" text-anchor="middle">revisor (sonnet)</text>
  <text class="t" x="803" y="686" text-anchor="middle">revisa o que o local fez</text>
  <line class="arr" x1="730" y1="673" x2="734" y2="673" marker-end="url(#a)"/>
  <text class="s" x="30" y="718">janela nova na pasta onde a conversa nasceu, em ambiente limpo (sem variáveis CLAUDE_*/ANTHROPIC_* herdadas).</text>
  <text class="s" x="30" y="735">marcador ~/.claude/ollama-pendente.json guarda a pendência de revisão até o Claude concluí-la.</text>
  <rect x="20" y="760" width="860" height="64" rx="6" fill="#EDE9FE" stroke="#7C3AED"/>
  <text class="h" x="30" y="782">Autoatualização — interruptor TOKEN_ROUTER_AUTOATUALIZAR=ligado (padrão: desligado)</text>
  <text class="s" x="30" y="805">SessionStart, no máx. a cada 6 h, em 2º plano: plugin · Ollama · Qwen · OpenCode · DSH — app em uso é pulado</text>
  <rect x="20" y="838" width="860" height="122" rx="6" class="cont"/>
  <text class="h" x="30" y="858">Perfil por máquina — SessionStart injeta maquinas/&lt;id&gt;.md; onde divergir das regras, vale o perfil</text>
  <text class="s" x="30" y="875">detecção: TOKEN_ROUTER_MAQUINA → hostname → darwin → VRAM (nvidia-smi) · inventário no repo estacoes</text>
  <rect x="35" y="886" width="270" height="64" rx="4" fill="#D1FAE5" stroke="#059669"/>
  <text class="b" x="45" y="905">workstation-windows</text>
  <text class="t" x="45" y="923">RTX 2000 Ada 16 GB · 128 GB</text>
  <text class="t" x="45" y="939">DSH gpt-oss:20b 100% GPU (13 s)</text>
  <rect x="315" y="886" width="270" height="64" rx="4" fill="#FEF3C7" stroke="#D97706"/>
  <text class="b" x="325" y="905">workstation Windows</text>
  <text class="t" x="325" y="923">RTX PRO 1000 8 GB · 64 GB</text>
  <text class="t" x="325" y="939">DSH gpt-oss 70 s (CPU/GPU)</text>
  <rect x="595" y="886" width="270" height="64" rx="4" fill="#FCE7F3" stroke="#DB2777"/>
  <text class="b" x="605" y="905">personal-device</text>
  <text class="t" x="605" y="923">48 GB unificados · arm64</text>
  <text class="t" x="605" y="939">DSH gpt-oss:20b · local 30b</text>
  <rect x="20" y="974" width="860" height="150" rx="6" class="cont"/>
  <text class="h" x="30" y="994">GSD — fluxo por fases (/gsd-*) · um GSD para cada runtime, independentes</text>
  <text class="s" x="30" y="1011">o do Claude vive em ~/.claude (acionado pelo Opus); o do Codex vive em ~/.codex e este plugin não o toca</text>
  <rect x="35" y="1022" width="270" height="92" rx="4" fill="#E0E7FF" stroke="#4F46E5"/>
  <text class="h" x="45" y="1041">Claude · Windows (por máquina)</text>
  <text class="s" x="45" y="1059">GSD instalado só com --claude</text>
  <text class="s" x="45" y="1075">config em settings.local.json</text>
  <text class="s" x="45" y="1091">(não versionado · caminhos C:/...)</text>
  <text class="s" x="45" y="1107">depois: separar-gsd.py</text>
  <rect x="315" y="1022" width="270" height="92" rx="4" fill="#F3F4F6" stroke="#9CA3AF"/>
  <text class="h" x="325" y="1041">claude-config (compartilhado)</text>
  <text class="s" x="325" y="1059">settings.json SEM nada do GSD</text>
  <text class="s" x="325" y="1075">hooks/separar-gsd.py (idempotente)</text>
  <text class="s" x="325" y="1091">.gitignore barra hooks/gsd-*</text>
  <text class="s" x="325" y="1107">nada do GSD do Codex aqui</text>
  <rect x="595" y="1022" width="270" height="92" rx="4" fill="#FEF3C7" stroke="#D97706"/>
  <text class="h" x="605" y="1041">Codex (independente)</text>
  <text class="s" x="605" y="1059">agentes em ~/.codex/agents</text>
  <text class="s" x="605" y="1075">instalado e atualizado à parte</text>
  <text class="s" x="605" y="1091">ajuste de esforço mora em ~/.codex</text>
  <text class="s" x="605" y="1107">fora do repo e do plugin</text>
  <rect x="20" y="1138" width="860" height="78" rx="4" fill="#F9FAFB" stroke="#D1D5DB"/>
  <text class="s" x="30" y="1158">Eixos, em ordem: 1 crédito (o que está escasso) · 2 latência · 3 contexto · 4 diversidade de família (gpt-oss revisa Qwen/Claude).</text>
  <text class="s" x="30" y="1176">Gatilhos: &gt;5 arquivos → qwen · 1–4 arquivos → dsh · pergunta sobre o acervo do caso → opencode</text>
  <text class="s" x="30" y="1192">· 2ª falha no bug → replanejar no Opus (/effort alto) · bloco &gt;200 linhas → revisor + dsh revisor</text>
  <text class="s" x="30" y="1208">· janela &gt;~120 mil → transferir. Ninguém pula camada: o Opus não chama o Ollama direto.</text>
  <rect x="20" y="1228" width="860" height="102" rx="4" fill="#FFFFFF" stroke="#D1D5DB"/>
  <text class="h" x="30" y="1247">Siglas</text>
  <text class="s" x="30" y="1266"><tspan font-weight="700">Ollama</tspan> — servidor de modelos locais (offline)</text>
  <text class="s" x="30" y="1283"><tspan font-weight="700">DSH</tspan> — DeepSeek Harness: agente de código local</text>
  <text class="s" x="30" y="1300"><tspan font-weight="700">GSD</tspan> — Get Shit Done: fluxo de projeto por fases</text>
  <text class="s" x="30" y="1317"><tspan font-weight="700">MCP</tspan> — Model Context Protocol: ferramentas ao agente</text>
  <text class="s" x="455" y="1266"><tspan font-weight="700">StopFailure</tspan> — hook do Claude Code: fim de crédito</text>
  <text class="s" x="455" y="1283"><tspan font-weight="700">rag</tspan> — busca no acervo indexado (RAG)</text>
  <text class="s" x="455" y="1300"><tspan font-weight="700">VRAM · GB</tspan> — memória da placa de vídeo · gigabytes</text>
  <text class="s" x="455" y="1317"><tspan font-weight="700">8b · 20b · 30b · 80B</tspan> — bilhões de parâmetros</text>
</svg>
