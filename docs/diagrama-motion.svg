<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 920" width="1000" height="920">
  <defs>
    <!-- Degradê de fundo suave Motion -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3EEFF"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E9F7FF"/>
    </linearGradient>

    <!-- Ambient Glows em SVG Puro (substitui feGaussianBlur compatível com GitHub) -->
    <radialGradient id="glow_pink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF7AC6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FF7AC6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow_blue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2F9BFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2F9BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow_purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow_green" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <!-- Motion Trails Diagonais -->
    <linearGradient id="trail_purple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8A5CF6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8A5CF6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#8A5CF6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="trail_blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Fundo -->
  <rect width="1000" height="920" fill="url(#bg)"/>

  <!-- Ambient Glows -->
  <circle cx="910" cy="110" r="230" fill="url(#glow_pink)"/>
  <circle cx="90" cy="790" r="250" fill="url(#glow_blue)"/>
  <circle cx="500" cy="330" r="280" fill="url(#glow_purple)"/>

  <!-- Motion Trails Diagonais (-12deg) -->
  <rect x="120" y="80" width="280" height="26" rx="13" fill="url(#trail_purple)" transform="rotate(-12 260 93)"/>
  <rect x="680" y="440" width="260" height="24" rx="12" fill="url(#trail_blue)" transform="rotate(-12 810 452)"/>
  <rect x="60" y="36" width="346.5" height="26" rx="13" fill="#DBEAFE" stroke="#BFDBFE" stroke-width="1"/>
  <text x="233.25" y="53" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#1D4ED8" text-anchor="middle" letter-spacing="0.5">ECONOMIA DE TOKENS · ROTEAMENTO LOCAL-FIRST</text><text x="60" y="86" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="26" font-weight="800" fill="#1B1F3B">TN-claude-tokenrouter · Roteador de Cota no Claude</text><text x="60" y="114" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="14" font-weight="500" fill="#4A5568">Estratégia em camadas: Opus estratégico → Sonnet despachante → Ollama local para tarefas braçais.</text>
  <rect x="82" y="158" width="840" height="68" rx="14" fill="#1B1F3B" fill-opacity="0.06"/>
  <rect x="81" y="154" width="840" height="68" rx="14" fill="#1B1F3B" fill-opacity="0.05"/>
  <rect x="80" y="150" width="840" height="68" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><rect x="94" y="160" width="165" height="18" rx="9" fill="#DBEAFE"/><text x="176" y="173" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="9" font-weight="800" fill="#1D4ED8" text-anchor="middle">NÍVEL 1: DECISÃO COGNITIVA</text><text x="270" y="174" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#1B1F3B">Claude Opus 5.5 (200k)</text><text x="96" y="198" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="11" font-weight="500" fill="#475569">Reservado exclusivamente para arquitetura, síntese executiva e decisões de trade-off.</text>
  <rect x="112" y="238" width="810" height="68" rx="14" fill="#1B1F3B" fill-opacity="0.06"/>
  <rect x="111" y="234" width="810" height="68" rx="14" fill="#1B1F3B" fill-opacity="0.05"/>
  <rect x="110" y="230" width="810" height="68" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><rect x="124" y="240" width="165" height="18" rx="9" fill="#EDE9FE"/><text x="206" y="253" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="9" font-weight="800" fill="#7C3AED" text-anchor="middle">NÍVEL 2: VARREDURA E DESPACHO</text><text x="300" y="254" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#1B1F3B">Claude Sonnet (200k)</text><text x="126" y="278" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="11" font-weight="500" fill="#475569">Processa tarefas intermediárias e direciona lotes de arquivos aos modelos locais.</text>
  <rect x="142" y="318" width="780" height="68" rx="14" fill="#1B1F3B" fill-opacity="0.06"/>
  <rect x="141" y="314" width="780" height="68" rx="14" fill="#1B1F3B" fill-opacity="0.05"/>
  <rect x="140" y="310" width="780" height="68" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><rect x="154" y="320" width="165" height="18" rx="9" fill="#FEF3C7"/><text x="236" y="333" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="9" font-weight="800" fill="#D97706" text-anchor="middle">NÍVEL 3: EXECUÇÃO MECÂNICA</text><text x="330" y="334" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#1B1F3B">Ollama Local (DSH 20b &amp; Qwen 36GB)</text><text x="156" y="358" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="11" font-weight="500" fill="#475569">Geração de boilerplate, edição mecânica e testes unitários a custo zero de nuvem.</text>
  <rect x="172" y="398" width="750" height="68" rx="14" fill="#1B1F3B" fill-opacity="0.06"/>
  <rect x="171" y="394" width="750" height="68" rx="14" fill="#1B1F3B" fill-opacity="0.05"/>
  <rect x="170" y="390" width="750" height="68" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><rect x="184" y="400" width="165" height="18" rx="9" fill="#F1F5F9"/><text x="266" y="413" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="9" font-weight="800" fill="#475569" text-anchor="middle">NÍVEL 4: CONTINGÊNCIA 429</text><text x="360" y="414" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#1B1F3B">Intercepção e Redirecionamento</text><text x="186" y="438" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="11" font-weight="500" fill="#475569">Tratamento de StopFailure e esgotamento de quota sem travar a sessão.</text>
  <rect x="172" y="478" width="750" height="45" rx="12" fill="#1B1F3B" fill-opacity="0.06"/>
  <rect x="171" y="474" width="750" height="45" rx="12" fill="#1B1F3B" fill-opacity="0.05"/>
  <rect x="170" y="470" width="750" height="45" rx="12" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1.5"/><text x="545" y="498" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="13" font-weight="800" fill="#15803D" text-anchor="middle">ECONOMIA MÉDIA DE ATÉ 85% DE TOKENS NA COTA ANTHROPIC</text>
  <!-- BLOCO DE DEMONSTRAÇÃO PRÁTICA -->
  
  <rect x="62" y="563" width="880" height="220" rx="22" fill="#1B1F3B" fill-opacity="0.06"/>
  <rect x="61" y="559" width="880" height="220" rx="22" fill="#1B1F3B" fill-opacity="0.05"/>
  <rect x="60" y="555" width="880" height="220" rx="22" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  
  <rect x="80" y="569" width="225" height="24" rx="12" fill="#1B1F3B"/>
  <text x="192" y="585" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="11" font-weight="800" fill="#60A5FA" text-anchor="middle" letter-spacing="0.8">DEMONSTRAÇÃO PRÁTICA</text>
  <text x="320" y="586" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#64748B">Fluxo operacional concreto do repositório</text>
  
  <!-- Coluna 1: Entrada -->
  
  <rect x="84" y="613" width="260" height="155" rx="14" fill="#1B1F3B" fill-opacity="0.06"/>
  <rect x="83" y="609" width="260" height="155" rx="14" fill="#1B1F3B" fill-opacity="0.05"/>
  <rect x="82" y="605" width="260" height="155" rx="14" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.5"/>
  <rect x="94" y="617" width="90" height="20" rx="10" fill="#EDE9FE"/>
  <text x="139" y="631" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="10" font-weight="800" fill="#7C3AED" text-anchor="middle">TAREFA REPETITIVA</text>
  <text x="96" y="655" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#1B1F3B">Migração de 8 Módulos</text>
  <text x="96" y="675" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#475569"><tspan x="96" dy="0">Usuário solicita alteração de</tspan><tspan x="96" dy="16">imports e tipagem em 8 arquivos</tspan><tspan x="96" dy="16">de serviço existentes no projeto.</tspan></text>
  
  <!-- Seta 1 -> 2 -->
  <circle cx="359" cy="682.5" r="14" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="359" y="687.5" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="13" font-weight="800" fill="#7C3AED" text-anchor="middle">→</text>
  
  <!-- Coluna 2: Processamento -->
  
  <rect x="379" y="613" width="260" height="155" rx="14" fill="#1B1F3B" fill-opacity="0.06"/>
  <rect x="378" y="609" width="260" height="155" rx="14" fill="#1B1F3B" fill-opacity="0.05"/>
  <rect x="377" y="605" width="260" height="155" rx="14" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1.5"/>
  <rect x="389" y="617" width="125" height="20" rx="10" fill="#E0F2FE"/>
  <text x="451" y="631" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="10" font-weight="800" fill="#0284C7" text-anchor="middle">DESVIO INTELIGENTE</text>
  <text x="391" y="655" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#1B1F3B">Roteamento para Ollama</text>
  <text x="391" y="675" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#475569"><tspan x="391" dy="0">O router intercepta a chamada,</tspan><tspan x="391" dy="16">mantém Opus descansado e aciona</tspan><tspan x="391" dy="16">o modelo local para o trabalho braçal.</tspan></text>
  
  <!-- Seta 2 -> 3 -->
  <circle cx="654" cy="682.5" r="14" fill="#E0F2FE" stroke="#7DD3FC" stroke-width="1.5"/>
  <text x="654" y="687.5" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="13" font-weight="800" fill="#0284C7" text-anchor="middle">→</text>
  
  <!-- Coluna 3: Saída -->
  
  <rect x="674" y="613" width="260" height="155" rx="14" fill="#1B1F3B" fill-opacity="0.06"/>
  <rect x="673" y="609" width="260" height="155" rx="14" fill="#1B1F3B" fill-opacity="0.05"/>
  <rect x="672" y="605" width="260" height="155" rx="14" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1.5"/>
  <rect x="684" y="617" width="105" height="20" rx="10" fill="#DCFCE7"/>
  <text x="736" y="631" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="10" font-weight="800" fill="#16A34A" text-anchor="middle">ENTREGA A CUSTO ZERO</text>
  <text x="686" y="655" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#1B1F3B">Preservação da Cota</text>
  <text x="686" y="675" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#475569"><tspan x="686" dy="0">Arquivos são migrados em série</tspan><tspan x="686" dy="16">e testados localmente sem gastar</tspan><tspan x="686" dy="16">nenhum token de nuvem.</tspan></text>
  <!-- Faixa Navy Inferior de Conclusão Técnica -->
  <rect x="60" y="800" width="880" height="64" rx="18" fill="#1B1F3B"/>
  <circle cx="95" cy="832" r="15" fill="#3B82F6" fill-opacity="0.25"/>
  <text x="95" y="837" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="15" font-weight="800" fill="#60A5FA" text-anchor="middle">✓</text>
  <text x="125" y="829" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">Produtividade Ilimitada com Respeito à Cota</text>
  <text x="125" y="848" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">Permite programar intensamente o dia todo, reservando os modelos de ponta para onde a cognição realmente importa.</text>
</svg>